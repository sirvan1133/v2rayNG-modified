<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: transparent;
    }

    .plane-fab {
      width: 62px;
      height: 62px;
      padding: 0;
      display: grid;
      place-items: center;
      border: none;
      border-radius: 50%;
      outline: none;
      cursor: pointer;
      color: #90a4ae;
      background: #37474f;
      box-shadow: 0 6px 16px rgba(0, 0, 0, .45);
      transition:
        transform .18s ease,
        background .35s ease,
        color .35s ease,
        box-shadow .35s ease;
    }

    .plane-fab:active {
      transform: scale(.94);
    }

    .plane-fab svg {
      width: 26px;
      height: 26px;
      transform: rotate(35deg);
      transition: transform .35s cubic-bezier(.2, .8, .2, 1);
    }

    .plane-fab.on {
      color: #fff;
      background: #00bfa5;
      box-shadow: 0 8px 24px rgba(0, 191, 165, .45);
      animation: planeFloat 3s ease-in-out infinite;
    }

    .plane-fab.on svg {
      transform: rotate(0);
    }

    @keyframes planeFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }
  </style>
</head>
<body>
  <button class="plane-fab" id="planeFab" type="button" aria-label="روشن یا خاموش کردن VPN">
    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
      <path d="M2 21l21-9L2 3v7l15 2-15 2z"/>
    </svg>
  </button>

  <script>
    var fab = document.getElementById("planeFab");
    var isOn = false;

    fab.addEventListener("click", function () {
      isOn = !isOn;
      fab.classList.toggle("on", isOn);
      Android.onToggle(isOn);
    });

    function setState(on) {
      isOn = Boolean(on);
      fab.classList.toggle("on", isOn);
    }
  </script>
</body>
</html>
